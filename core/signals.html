<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StoryLab - Signal Directory</title><style>:root{--navy:#0D1B3E;--amber:#E8A020;--cream:#F8F6F1;--text:#1A1A2E;--muted:#667085;--line:#E4E7EC}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}header{background:var(--navy);color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:18px;font-weight:800}.logo span{color:var(--amber)}header a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:5px 13px;font-size:12px;font-weight:700}main{max-width:1050px;margin:auto;padding:36px 24px 60px}.eyebrow{color:#9a6500;text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800}h1{margin:7px 0;font-size:32px}.intro{color:var(--muted);max-width:760px;font-size:16px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.controls input,.controls select,.tag-add input{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;font:inherit}.controls input{min-width:260px}.signal{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px 19px;margin-bottom:12px}.signal h2{font-size:17px;margin:5px 0}.signal h2 a{color:var(--navy)}.meta{font-size:12px;color:var(--muted)}.summary{margin:10px 0;color:#41485a}.tag{display:inline-flex;align-items:center;gap:5px;background:#edf3ff;color:#264a82;border-radius:13px;padding:3px 8px;margin:2px 4px 2px 0;font-size:12px;font-weight:700}.tag button{border:0;background:transparent;color:#264a82;cursor:pointer;font-size:14px;padding:0}.tag-add{display:inline-flex;gap:5px;margin-top:9px}.tag-add input{padding:5px 8px;font-size:12px;width:185px}.tag-add button,button{border:0;border-radius:6px;background:var(--amber);color:var(--navy);font-weight:800;padding:6px 10px;cursor:pointer;font-size:12px}.empty{color:var(--muted);padding:28px;text-align:center}</style></head><body><header><div class="logo">STORY<span>LAB</span> - Signal Directory</div><a href="/">Back to dashboard</a></header><main><div class="eyebrow">Fan Atlas Insiders</div><h1>Named signal directory</h1><p class="intro">Add your own institution, conference, person, athlete, executive, or program tags. Then filter across every flywheel group without turning a tag into a lead score or sales conclusion.</p><div class="controls"><input id="search" placeholder="Search signals, sources, or tags"><select id="tag-filter"><option value="">All tags</option></select></div><section id="results"><div class="empty">Loading signals...</div></section></main><script>let data={articles:[],tags:[]};const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const date=v=>v?new Date(v).toLocaleDateString():'Date unavailable';function tagsFor(id){return data.tags.filter(t=>t.article_id===id)}function render(){const search=document.getElementById('search').value.toLowerCase(),selected=document.getElementById('tag-filter').value,articles=data.articles.filter(a=>{const tags=tagsFor(a.id),text=[a.title,a.source,a.summary,...tags.map(t=>t.tag)].join(' ').toLowerCase();return(!search||text.includes(search))&&(!selected||tags.some(t=>t.tag===selected))}),root=document.getElementById('results');if(!articles.length){root.innerHTML='<div class="empty">No matching signals.</div>';return}root.innerHTML=articles.map(a=>`<article class="signal"><div class="eyebrow">${esc(a.category)} · ${a.relevance_score}/5</div><h2><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h2><div class="meta">${esc(a.source)} · ${date(a.published_date)} · ${esc(a.story_type||'Unclassified')}</div><p class="summary">${esc(a.summary||'No RSS summary was provided.')}</p><div>${tagsFor(a.id).map(t=>`<span class="tag">${esc(t.tag)} <button data-delete="${t.id}" title="Remove tag">×</button></span>`).join('')}</div><div class="tag-add"><input data-input="${a.id}" placeholder="Add a named tag"><button data-add="${a.id}">Add tag</button></div></article>`).join('')}async function load(){const response=await fetch('/api/signal-directory');data=await response.json();const unique=[...new Set(data.tags.map(t=>t.tag))].sort((a,b)=>a.localeCompare(b));document.getElementById('tag-filter').innerHTML='<option value="">All tags</option>'+unique.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');render()}document.getElementById('search').addEventListener('input',render);document.getElementById('tag-filter').addEventListener('change',render);document.getElementById('results').addEventListener('click',async e=>{const remove=e.target.closest('[data-delete]');if(remove){await fetch('/api/article-tags/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:+remove.dataset.delete})});await load();return}const add=e.target.closest('[data-add]');if(add){const input=document.querySelector(`[data-input="${add.dataset.add}"]`),tag=input.value.trim();if(!tag)return;await fetch('/api/article-tags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({article_id:+add.dataset.add,tag})});await load()}});load();</script></body></html>

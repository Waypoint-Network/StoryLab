<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StoryLab - Feed Health</title><style>:root{--navy:#0D1B3E;--amber:#E8A020;--cream:#F8F6F1;--text:#1A1A2E;--muted:#667085;--line:#E4E7EC}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}header{background:var(--navy);color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:18px;font-weight:800}.logo span{color:var(--amber)}header a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:5px 13px;font-size:12px;font-weight:700}main{max-width:1000px;margin:auto;padding:36px 24px 60px}.eyebrow{color:#9a6500;text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800}h1{font-size:32px;margin:7px 0}.intro{color:var(--muted);font-size:16px}.health{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:11px 0}.row{display:flex;align-items:start;justify-content:space-between;gap:15px}.name{font-weight:800;font-size:16px}.url{display:block;color:var(--muted);font-size:12px;word-break:break-all;margin-top:3px}.badge{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:800;border-radius:12px;padding:4px 8px;white-space:nowrap}.healthy{background:#e8f6ec;color:#176b3a}.failing{background:#fff0f0;color:#9a1b1b}.never_checked{background:#fff6df;color:#8a5a00}.details{color:var(--muted);font-size:12px;margin-top:10px}.error{margin-top:7px;color:#9a1b1b;font-size:12px}.empty{padding:28px;color:var(--muted);text-align:center}</style></head><body><header><div class="logo">STORY<span>LAB</span> - Feed Health</div><a href="/feeds">Back to feeds</a></header><main><div class="eyebrow">Source reliability</div><h1>Feed health</h1><p class="intro">A transparent view of which sources are delivering, failing, or have not yet been checked. This reports the last attempted fetch; it does not silently retry or hide errors.</p><section id="feeds"><div class="empty">Loading feed health...</div></section></main><script>const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const date=v=>v?new Date(v).toLocaleString():'Never checked';async function load(){const response=await fetch('/api/feed-health'),data=await response.json();document.getElementById('feeds').innerHTML=data.feeds.length?data.feeds.map(f=>`<article class="health"><div class="row"><div><div class="eyebrow">${esc(f.category)}</div><div class="name">${esc(f.label)}</div><span class="url">${esc(f.url)}</span></div><span class="badge ${esc(f.state)}">${esc(f.state.replace('_',' '))}</span></div><div class="details">Last checked: ${date(f.last_checked)}${f.items_added!==null&&f.items_added!==undefined?` · ${f.items_added} new article${f.items_added===1?'':'s'} added`:''}</div>${f.error?`<div class="error">Last error: ${esc(f.error)}</div>`:''}</article>`).join(''):'<div class="empty">No feeds are configured yet.</div>'}load();</script></body></html>
